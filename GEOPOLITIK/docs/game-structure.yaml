  table_to_queries:
    Countries:
      - countryQueries.getCountries
      - countryQueries.getCountryById
      - countryQueries.getCountryByName
      - countryQueries.getCountryDetails
      - countryQueries.getTotalCountryPopulation
      - diplomacyQueries.getCountryDiplomacyStatus
      - diplomacyQueries.getDiplomacyRate
    Provinces:
      - countryQueries.getCountryResources
      - countryQueries.getCountryDetails
      - countryQueries.getProvincesByCountry
      - provinceQueries.getProvinceData
      - attackQueries.getInfrastructureByType
      - attackQueries.getCiviliansByCountry
      - attackQueries.getMilitaryObjectivesByCountry
      - weaponQueries.getArmy
    ProvinceResources:
      - countryQueries.getCountryResources
      - countryQueries.getCountryDetails
      - provinceQueries.getProvinceData
      - provinceQueries.getProvinceResources
    Resources:
      - countryQueries.getCountryResources
      - countryQueries.getCountryDetails
      - countryQueries.getCountryMoney
      - provinceQueries.getProvinceData
      - provinceQueries.getProvinceResources
      - countryResourceQueries.getCountryResources
    TotalResources:
      - countryQueries.getCountryMoney
      - countryResourceQueries.getCountryResources
    Infraestructure:
      - attackQueries.getInfrastructureByType
    ProvinceInfraestructure:
      - attackQueries.getInfrastructureByType
    Weapons:
      - weaponQueries.getWeapons
      - weaponQueries.getArmy
      - attackQueries.getMilitaryObjectivesByCountry
      - defenseQueries.getProvinceDefenses
    ProvinceDefenses:
      - weaponQueries.getArmy
      - attackQueries.getMilitaryObjectivesByCountry
      - defenseQueries.getProvinceDefenses
    Improvements:
      - improvementQueries.getImprovements
      - improvementQueries.getImprovementById
    CountryDiplomacyStatus:
      - diplomacyQueries.getCountryDiplomacyStatus
    DiplomacyRate:
      - diplomacyQueries.getDiplomacyRate
    "view totalCountryPopulation":
      - countryQueries.getTotalCountryPopulation

  controller_to_tables:
    MenuController: [Countries, Provinces, ProvinceResources, Resources, totalCountryPopulation]
    CountryViewControllers: [Countries, Provinces, ProvinceResources, Resources]
    ProvinceViewControllers: [ProvinceDefenses, Weapons]
    AttackController: [Provinces, ProvinceInfraestructure, Infraestructure, ProvinceDefenses, Weapons]
    LaboratoryController: [TotalResources, Resources, Improvements]
    WarMinisterController: [ProvinceDefenses, Weapons, Provinces]
    WeaponsMarketControllers: [Weapons]
    MarketConfirmControllers: [TotalResources, Resources]
    PopulationController: []
    NewsController: []
    RelacionesController: [CountryDiplomacyStatus, Countries]
    diplomacyCountryController: [CountryDiplomacyStatus, Countries]
    diplomacyActionsController: []
    warDeclarationController: []
    cancelTreatyController: []
    treatyController: [TotalResources, Resources]
    tradeController: []
    transactionController: []

# =============================================================================
# 9. FLUJOS DE PUNTA A PUNTA
# =============================================================================
flows:
  click_en_mapa:
    steps:
      - "MenuController.onImagenPrincipalClick(MouseEvent)"
      - "mapFunctions.getColor(x, y) -> indice de color del pixel en loadMap.mapColors"
      - "mapFunctions.getCountryFromList(color) -> nombre via loadMatch.colorList (data/middle_east_list.json)"
      - "countryQueries.getCountryByName(name) -> SELECT ... WHERE name_en = ?"
      - "MenuController.openCountryView(country) -> countryView.fxml + setCountryData"
  ver_pais:
    steps:
      - "CountryViewControllers.setCountryData -> cargarDatos(countryId)"
      - "countryQueries.getCountryDetails(countryId) -> capital, gobierno, poblacion, ingresos"
      - "countryQueries.getProvincesByCountry(countryId) -> filas de provincias (construidas en codigo)"
      - "bandera via loadFlags.getFlag(countryId)"
  ver_provincia:
    steps:
      - "Click en fila de provincia -> CountryViewControllers.openProvinceView"
      - "provinceQueries.getProvinceData(provinceName, countryId)"
      - "provinceQueries.getProvinceResources(idProvince) -> Map recurso->produccion"
      - "ProvinceViewControllers.setProvinceData(data, countryName)"
      - "defenseQueries.getProvinceDefenses(idProvince) -> armas y cantidades"
  ataque:
    steps:
      - "ProvinceViewControllers.openCombatView -> combatView.fxml (AttackController)"
      - "AttackController.setCountryData(countryId, countryName)"
      - "AttackController.loadResultados(selector) decide que metodo de attackQueries usar"
      - "attackQueries devuelve List<ProvinceObjective>; el controlador agrupa por provincia"
      - "launchAttack() ejecuta la simulacion artilleryAttack (sin escribir en BD)"
  diplomacia:
    steps:
      - "diplomacyCountryController.loadData -> diplomacyQueries.getCountryDiplomacyStatus(11)"
      - "filas aliado/enemigo -> openDiplomacyActions o openTradeView"
      - "treatyController -> countryQueries.getCountryMoney + countryResourceQueries.getCountryResources"
      - "warDeclarationController / cancelTreatyController solo cierran el dialogo (sin persistir)"
  laboratorio:
    steps:
      - "LaboratoryController.cargarDinero -> countryQueries.getCountryMoney(11)"
      - "LaboratoryController.cargarMejoras -> improvementQueries.getImprovements()"
      - "filtrar(tipo) en memoria; seleccion guardada en countryInvestigations (singleton)"
      - "no se escribe en CountryImprovements"
  mercado_de_armas:
    steps:
      - "WeaponsMarketControllers.initialize -> loadWeapons (cache de weaponQueries.getWeapons)"
      - "carrito en memoria -> marketConfirmView.fxml"
      - "MarketConfirmControllers.setCartData -> countryQueries.getCountryMoney(11)"
      - "onComprarClick solo cierra: no se persiste nada"

# =============================================================================
# 10. ESTADO EN MEMORIA (sustituye a la persistencia)
# =============================================================================
in_memory_state:
  countryInvestigations:
    file: functions/improvementsFunctions/countryInvestigations.java
    singleton: true
    structure: "Map<Integer idPais, investigations>"
    used_by: [LaboratoryController]
    persists: false
  loadWeapons.weapons:
    type: "List<Weapon> estatica"
    used_by: [WeaponsMarketControllers]
  loadMatch.match / loadMatch.colorList:
    type: "Match y Map<String,String> estaticos"
    used_by: [loadMap, mapFunctions, MenuController]
  loadImages / loadFlags caches:
    type: "Map estaticos"
    used_by: [MenuController, CountryViewControllers, provincia, diplomacia, ataque]

# =============================================================================
# 11. CODIGO SIN USO DETECTADO
# =============================================================================
unused_code:
  query_methods:
    - "countryQueries.getCountries"
    - "countryQueries.getCountryById"
    - "improvementQueries.getImprovementById"
    - "diplomacyQueries.getDiplomacyRate"
  tables_without_queries:
    - CountryImprovements
    - Spying
    - NonAgressionAgreement
    - ComercialAgreement
    - LastEvents
    - Powers
    - InternationalComunity
  views_without_queries:
    - militaryInfraestructureCountry
    - civillianInfraestructureCountry
    - TotalCountryDefenses
  classes:
    - "functions/combatFuctions/aerialActions.java (metodos vacios)"
    - "functions/combatFuctions/options.java (interfaz vacia)"
    - "functions/resourceFunctions/production.java (clase vacia)"
    - "controllers/diplomacy/tradeController.java (stub)"
    - "controllers/diplomacy/transactionController.java (stub)"
  dead_constants:
    - "provinceQueries.RESOURCE_COLUMNS"
  unreferenced_resource:
    - "data/combat_effects_dialogs.json"
  broken_fxml_reference:
    - "views/diplomacyViews/transactionView.fxml declara fx:controller='controllers.TreatyConfirmationController', clase inexistente."

# =============================================================================
# 12. PARTICULARIDADES CONOCIDAS
# =============================================================================
known_quirks:
  - "Todo el acceso a SQLite es de lectura; no hay capa de escritura ni transacciones."
  - "El pais jugador esta fijado a Israel (id 11): MenuController, AttackController.ORIGIN_COUNTRY_ID,
     LaboratoryController.ID_PAIS, diplomacyCountryController.COUNTRY_ID, MarketConfirmControllers."
  - "countryQueries.getCountryByName filtra por Countries.name_en, no por name."
  - "Los ingresos se derivan del recurso 'Dinero' (producion en ProvinceResources; stock en TotalResources)."
  - "Resources contiene 'Agricultura' con acento, por eso la consulta acepta ambas grafias."
  - "Infraestructure.type usa 'Civil'/'Militar'; la vista civillianInfraestructureCountry filtra por 'civil' y por eso devuelve 0 filas."
  - "ProvinceInfraestructure tiene PK solo en id_province: modela como maximo una infraestructura por provincia."
  - "Las vistas se consultan directamente (totalCountryPopulation) o se ignoran; no hay mapeo ORM."
  - "getCountryResources y getCountryDetails suman Provinces.population/area despues de un JOIN con
     ProvinceResources: cada provincia aparece una vez por recurso, asi que la poblacion/area se
     multiplican por el numero de recursos de la provincia. La vista totalCountryPopulation no
     tiene ese problema porque solo agrega Provinces."
  - "Las listas de la UI nunca usan ListView/TableView de datos: son VBox/FlowPane llenados a mano."
  - "Los controladores se comunican con los dialogos por setters publicos, no por inyeccion de dependencias."
