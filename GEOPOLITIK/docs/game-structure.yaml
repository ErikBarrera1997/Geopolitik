# =============================================================================
# 6. CARGA DE RECURSOS NO-SQL (arranque)
# =============================================================================
bootstrap_loaders:
  loadDataBases:
    produces: "DatabaseConnection inicializada"
    source: "db/middleeastdb.db"
  loadMatch:
    produces: "Match (matchs/match.json) + Map<String,String> colorList (data/middle_east_list.json)"
    fields: [map, rules, flag, leader, database]
    note: "match.json trae 'country' pero Match no tiene ese campo: Gson lo descarta."
  loadMap:
    produces: "mapColors[] y mapWidth/mapHeight a partir de la imagen del mapa"
    usage: "cuantiza colores (precision 32) y asigna un id por color"
  loadImages:
    produces: "Map<String,Image> de iconos, iconos de ataque e imagenes de armas"
    source_dirs: ["img/icons", "img/attack icons", "img/weapons"]
  loadFlags:
    produces: "Map<Integer,flag> con id de pais -> ruta de bandera"
    source_dir: "img/flags"
    id_map_note: "israel = 11"
  loadWeapons:
    produces: "List<Weapon> cacheada (weaponQueries.getWeapons)"
  loadCombatActions:
    produces: ["combat_list", "operations_list", "combat_descriptions"]
    source: ["data/combat_options_list.json", "data/combat_descriptions.json"]

