name: Java CI

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: 21
        distribution: 'temurin'
        cache: maven

    - name: Setup Xvfb (for JavaFX headless)
      run: sudo apt-get update && sudo apt-get install -y xvfb

    - name: Build and test
      working-directory: GEOPOLITIK
      run: xvfb-run mvn -B verify
